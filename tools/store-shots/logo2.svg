<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<!-- Hand-drawn vector of tabmanagerlogo2.png (128 px raster, no larger source). Three windows, 60×52,
     offset (17,19); colours sampled from the PNG. -->
<defs>
	<g id="win">
		<rect x="0" y="0" width="60" height="52" rx="4.5"/>
	</g>
</defs>
<g stroke="#545557" stroke-width="3" stroke-linejoin="round">
	<!-- back: yellow -->
	<g transform="translate(51 59)">
		<rect width="60" height="52" rx="4.5" fill="#FFE07F"/>
		<rect x="6" y="20" width="49" height="5" fill="#F3CD70" stroke="none"/>
		<rect x="6" y="33" width="49" height="14" fill="#EEC66A" stroke="none"/>
		<path d="M4.5 0 H55.5 A4.5 4.5 0 0 1 60 4.5 V10 H0 V4.5 A4.5 4.5 0 0 1 4.5 0 Z" fill="#BFBFBF"/>
		<circle cx="47" cy="5.3" r="1.6" fill="#3B3B3B" stroke="none"/><circle cx="53" cy="5.3" r="1.6" fill="#3B3B3B" stroke="none"/>
		<rect width="60" height="52" rx="4.5" fill="none"/>
	</g>
	<!-- middle: green -->
	<g transform="translate(34 40)">
		<rect width="60" height="52" rx="4.5" fill="#AED3B8"/>
		<rect x="6" y="17" width="49" height="5" fill="#9AB3A1" stroke="none"/>
		<rect x="6" y="28" width="49" height="17" fill="#8DB59A" stroke="none"/>
		<path d="M4.5 0 H55.5 A4.5 4.5 0 0 1 60 4.5 V10 H0 V4.5 A4.5 4.5 0 0 1 4.5 0 Z" fill="#BFBFBF"/>
		<circle cx="47" cy="5.3" r="1.6" fill="#3B3B3B" stroke="none"/><circle cx="53" cy="5.3" r="1.6" fill="#3B3B3B" stroke="none"/>
		<rect width="60" height="52" rx="4.5" fill="none"/>
	</g>
	<!-- front: salmon, with the raised tab and the face -->
	<g transform="translate(17 21)">
		<rect width="60" height="52" rx="4.5" fill="#FECBAE"/>
		<rect x="6" y="19" width="48" height="4" fill="#FBB18E" stroke="none"/>
		<rect x="6" y="27" width="48" height="18" fill="#FD966D" stroke="none"/>
		<path d="M4.5 0 H55.5 A4.5 4.5 0 0 1 60 4.5 V11 H0 V4.5 A4.5 4.5 0 0 1 4.5 0 Z" fill="#BFBFBF"/>
		<!-- the active tab, raised above the title bar -->
		<path d="M8 11 V-1.5 A3 3 0 0 1 11 -4.5 H22 A3 3 0 0 1 25 -1.5 V11" fill="#FD966D"/>
		<rect x="12.5" y="1" width="8" height="3" rx="0.8" fill="#FE683B" stroke="none"/>
		<circle cx="41.5" cy="5.6" r="1.6" fill="#3B3B3B" stroke="none"/><circle cx="46.5" cy="5.6" r="1.6" fill="#3B3B3B" stroke="none"/><circle cx="52.5" cy="5.6" r="1.6" fill="#3B3B3B" stroke="none"/>
		<rect width="60" height="52" rx="4.5" fill="none"/>
		<!-- face -->
		<circle cx="24" cy="21.5" r="3.6" fill="#3B3B3B" stroke="none"/>
		<circle cx="36" cy="21.5" r="3.6" fill="#3B3B3B" stroke="none"/>
		<clipPath id="mouth"><path d="M16.5 28.5 H43.5 C43.5 37 37.5 42.5 30 42.5 C22.5 42.5 16.5 37 16.5 28.5 Z"/></clipPath>
		<path d="M16.5 28.5 H43.5 C43.5 37 37.5 42.5 30 42.5 C22.5 42.5 16.5 37 16.5 28.5 Z" fill="#3B3B3B" stroke="#2f3236" stroke-width="1.6"/>
		<ellipse cx="30" cy="40.5" rx="9" ry="6.5" fill="#E23833" stroke="none" clip-path="url(#mouth)"/>
	</g>
</g>
</svg>
